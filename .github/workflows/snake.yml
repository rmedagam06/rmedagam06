name: Generate Contribution Snake

# Runs every 12 hours and on manual trigger / push to main
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs (light + dark)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#a855f7&color_dots=#ebedf0,#f5d0fe,#e9a8ff,#c084fc,#a855f7
            dist/snake-dark.svg?palette=github-dark&color_snake=#ec4899&color_dots=#21262d,#7e22ce,#a855f7,#d946ef,#f0abfc

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
