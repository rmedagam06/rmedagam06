<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- backing panel -->
  <rect x="1" y="1" width="898" height="318" rx="18" fill="url(#panel)" stroke="#2d3350" stroke-width="1.5"/>

  <!-- title -->
  <text x="34" y="46" fill="#e6edf3" font-size="20" font-weight="700">Bastani Lab · Formal Verification of LLM Security Policies</text>
  <text x="34" y="70" fill="#8b93b8" font-size="13.5">TRUSTML @ Penn — do CLI agents actually stay inside least-privilege?</text>

  <!-- flow path (invisible, used for motion) -->
  <path id="flow" d="M 120 165 H 782" fill="none" stroke="none"/>

  <!-- connecting rail -->
  <line x1="120" y1="165" x2="782" y2="165" stroke="#2d3350" stroke-width="3" stroke-linecap="round"/>

  <!-- animated packets riding the rail -->
  <g fill="url(#accent)" filter="url(#glow)">
    <circle r="6">
      <animateMotion dur="4s" repeatCount="indefinite" rotate="auto" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
        <mpath href="#flow"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;1;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="5">
      <animateMotion dur="4s" begin="1.3s" repeatCount="indefinite">
        <mpath href="#flow"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;1;0" dur="4s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
    <circle r="4">
      <animateMotion dur="4s" begin="2.6s" repeatCount="indefinite">
        <mpath href="#flow"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;1;0" dur="4s" begin="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- stage nodes -->
  <!-- 1: CLI agent -->
  <g>
    <rect x="70" y="120" width="120" height="90" rx="12" fill="#1c2233" stroke="url(#accent)" stroke-width="2"/>
    <text x="130" y="150" text-anchor="middle" fill="#e6edf3" font-size="26">🖥️</text>
    <text x="130" y="182" text-anchor="middle" fill="#cdd4f0" font-size="13" font-weight="600">CLI Agent</text>
    <text x="130" y="200" text-anchor="middle" fill="#8b93b8" font-size="10.5">89 tasks</text>
    <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" repeatCount="indefinite"/>
  </g>

  <!-- 2: generated policy -->
  <g>
    <rect x="240" y="120" width="120" height="90" rx="12" fill="#1c2233" stroke="url(#accent)" stroke-width="2"/>
    <text x="300" y="150" text-anchor="middle" font-size="26">📝</text>
    <text x="300" y="182" text-anchor="middle" fill="#cdd4f0" font-size="13" font-weight="600">Cedar Policy</text>
    <text x="300" y="200" text-anchor="middle" fill="#8b93b8" font-size="10.5">LLM-generated</text>
    <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" begin="0.8s" repeatCount="indefinite"/>
  </g>

  <!-- 3: cvc5 -->
  <g>
    <rect x="410" y="120" width="120" height="90" rx="12" fill="#1c2233" stroke="url(#accent)" stroke-width="2"/>
    <text x="470" y="150" text-anchor="middle" font-size="26">🧮</text>
    <text x="470" y="182" text-anchor="middle" fill="#cdd4f0" font-size="13" font-weight="600">cvc5 SMT</text>
    <text x="470" y="200" text-anchor="middle" fill="#8b93b8" font-size="10.5">equivalence check</text>
    <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" begin="1.6s" repeatCount="indefinite"/>
  </g>

  <!-- 4: trace analysis -->
  <g>
    <rect x="580" y="120" width="120" height="90" rx="12" fill="#1c2233" stroke="url(#accent)" stroke-width="2"/>
    <text x="640" y="150" text-anchor="middle" font-size="26">🔎</text>
    <text x="640" y="182" text-anchor="middle" fill="#cdd4f0" font-size="13" font-weight="600">Trace Audit</text>
    <text x="640" y="200" text-anchor="middle" fill="#8b93b8" font-size="10.5">12k+ traces</text>
    <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" begin="2.4s" repeatCount="indefinite"/>
  </g>

  <!-- 5: verdict -->
  <g>
    <rect x="750" y="120" width="120" height="90" rx="12" fill="#12251f" stroke="url(#ok)" stroke-width="2"/>
    <text x="810" y="152" text-anchor="middle" font-size="26">✅</text>
    <text x="810" y="182" text-anchor="middle" fill="#c7f9ec" font-size="12.5" font-weight="600">Least-Priv</text>
    <text x="810" y="200" text-anchor="middle" fill="#7fd8c4" font-size="10.5">verified</text>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite"/>
  </g>

  <!-- privilege chips -->
  <g font-size="10.5" fill="#8b93b8">
    <rect x="34" y="255" width="92" height="24" rx="12" fill="#171c2e" stroke="#2d3350"/>
    <text x="80" y="271" text-anchor="middle">ReadFile</text>
    <rect x="136" y="255" width="96" height="24" rx="12" fill="#171c2e" stroke="#2d3350"/>
    <text x="184" y="271" text-anchor="middle">WriteFile</text>
    <rect x="242" y="255" width="92" height="24" rx="12" fill="#171c2e" stroke="#2d3350"/>
    <text x="288" y="271" text-anchor="middle">FetchUrl</text>
    <rect x="344" y="255" width="104" height="24" rx="12" fill="#171c2e" stroke="#2d3350"/>
    <text x="396" y="271" text-anchor="middle">ListenPort</text>
    <rect x="458" y="255" width="132" height="24" rx="12" fill="#171c2e" stroke="#2d3350"/>
    <text x="524" y="271" text-anchor="middle">InstallPackage</text>
  </g>
  <text x="866" y="272" text-anchor="end" fill="#ec4899" font-size="11" font-weight="600">–78% trace noise</text>
</svg>
